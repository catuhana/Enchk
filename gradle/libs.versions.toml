[versions]
minecraft = "26.3"

java = "25"
kotlin = "2.4.21" # keep in sync with `fabric-language-kotlin`

fabric-api = "0.164.0+26.3"
fabric-loader = "0.20.1"
fabric-loom = "1.19.3"
fabric-language-kotlin = "1.14.2+kotlin.2.4.21"

[libraries]
minecraft = { module = "com.mojang:minecraft", version.ref = "minecraft" }

fabric-api = { module = "net.fabricmc.fabric-api:fabric-api", version.ref = "fabric-api" }
fabric-loader = { module = "net.fabricmc:fabric-loader", version.ref = "fabric-loader" }
fabric-language-kotlin = { module = "net.fabricmc:fabric-language-kotlin", version.ref = "fabric-language-kotlin" }

betterconfig-fabric = { module = "dev.xpple:betterconfig-fabric", version = "2.9.0" }

mc_seed = { module = "com.seedfinding:mc_seed", version = "1.171.2" }

mcdev_annotations = { module = "com.demonwav.mcdev:annotations", version = "2.1.0" }

latticg = { module = "com.seedfinding:latticg", version = "1.07" }
jspecify = { module = "org.jspecify:jspecify", version = "1.0.1" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
fabric-loom = { id = "net.fabricmc.fabric-loom", version.ref = "fabric-loom" }
